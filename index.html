<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>토목기사 실기 말따먹기</title>
  <style>
    :root {
      --primary: #e61e2b;
      --primary-bg: #fff5f5;
      --success: #4caf50;
      --success-bg: #e8f5e9;
      --danger: #f44336;
      --danger-bg: #ffebee;
      --text: #333333;
      --gray-light: #f5f5f5;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text); }
    .phone-container { width: 100%; max-width: 420px; height: 100vh; max-height: 840px; background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: white; }
    .screen.active { display: flex; }
    .header { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; font-size: 18px; }
    .header-left, .header-right { display: flex; align-items: center; gap: 16px; font-size: 20px; cursor: pointer; }
    .header-logo { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800; color: #111; }
    .logo-box { width: 20px; height: 20px; background: var(--primary); border-radius: 4px; position: relative; }
    .logo-box::after { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; background: white; border-radius: 1px; }
    .content { flex: 1; overflow-y: auto; padding: 20px 16px; -webkit-overflow-scrolling: touch; }
    
    .main-title-box { text-align: center; margin: 30px 0 20px; }
    .main-title { font-size: 26px; font-weight: 800; line-height: 1.3; color: #111; word-break: keep-all; }
    
    /* 유형 선택 UI */
    .type-selector { margin-bottom: 20px; }
    .type-label { font-size: 14px; color: #666; margin-bottom: 10px; text-align: center; font-weight: bold; }
    .type-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px; }
    .type-btn { padding: 12px; border: 1px solid var(--border); background: white; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #555; transition: 0.2s; }
    .type-btn.active { background: #1976d2; color: white; border-color: #1976d2; }

    /* 모달 팝업 UI */
    .modal-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index: 1000; }
    .modal-box { background: white; padding: 24px; border-radius: 16px; width: 85%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .modal-box h3 { margin-bottom: 12px; font-size: 18px; text-align: center; }
    .modal-box p { font-size: 13px; color: #666; margin-bottom: 20px; text-align: center; word-break: keep-all; line-height: 1.4; }
    .range-inputs { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .range-inputs input { flex: 1; height: 44px; text-align: center; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; }
    .modal-btns { display: flex; gap: 12px; }
    .modal-btns button { flex: 1; height: 44px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }
    .modal-btns button:first-child { background: var(--gray-light); color: #555; }

    .qty-selector { background: var(--gray-light); border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: center; margin: 0 10px 24px; }
    .qty-label { font-size: 14px; color: #666; margin-bottom: 12px; font-weight: bold; }
    .qty-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .btn-qty { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: white; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-number { font-size: 24px; font-weight: bold; min-width: 80px; }
    .btn-start { width: calc(100% - 20px); margin: 0 10px 40px; height: 52px; background: #1976d2; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .sub-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 36px; font-size: 14px; color: #666; }
    .progress-track { flex: 1; height: 4px; background: var(--gray-light); border-radius: 2px; margin: 0 12px; position: relative; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: #1976d2; width: 0%; transition: width 0.3s ease; border-radius: 2px; }
    
    .question-wrapper { margin-bottom: 24px; }
    .star-badge { display: inline-block; background-color: #e1f5fe; color: #0288d1; font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 6px; margin-bottom: 12px; }
    .question-num { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 8px; display: flex; align-items: baseline; gap: 6px; }
    .question-num span { font-size: 13px; color: #888; font-weight: normal; }
    .question-text { font-size: 16px; font-weight: bold; line-height: 1.5; margin-bottom: 8px; word-break: keep-all; white-space: pre-wrap; }
    .question-guide { font-size: 13px; color: #1976d2; font-weight: bold; margin-bottom: 16px; }

    .multi-input-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .input-row { display: flex; align-items: center; gap: 8px; position: relative; }
    .input-label { font-weight: bold; font-size: 14px; color: #555; width: 64px; flex-shrink: 0; text-align: right; }
    .subj-input { flex: 1; height: 48px; padding: 0 16px; font-size: 15px; border: 1px solid var(--border); border-radius: 12px; transition: border-color 0.2s; }
    .subj-input:focus { outline: none; border-color: #1976d2; background: #f5f9ff; }
    .subj-input[readonly] { background: var(--gray-light); color: #555; border-color: transparent; }
    
    .input-status-icon { font-size: 18px; width: 24px; text-align: center; font-weight: bold; }
    .input-status-icon.correct { color: var(--success); }
    .input-status-icon.incorrect { color: var(--danger); }

    .btn-idk { align-self: flex-end; padding: 8px 16px; background: #fff; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
    .btn-idk:active { background: var(--danger-bg); }

    .explanation-box { margin-top: 24px; padding: 16px; background: var(--gray-light); border-radius: 12px; display: none; }
    .exp-title { font-weight: bold; color: #333; margin-bottom: 6px; font-size: 14px; }
    .exp-real-answer { font-size: 14px; font-weight: normal; color: #222; background: white; padding: 14px; border-radius: 8px; border: 1px solid var(--border); line-height: 1.6; white-space: pre-wrap; word-break: break-all; }

    .footer-btn-area { padding: 16px; border-top: 1px solid var(--border); }
    .btn-next { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: #fdfdfd; color: #aaa; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-next.ready { background: #111; color: #fff; border-color: #111; }

    .result-summary-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
    .result-val { font-weight: bold; color: var(--primary); }
    .result-header { font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .review-card { border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; }
    .review-card.correct { border-color: var(--success); }
    .review-card.incorrect { border-color: var(--danger); }
    .badge { position: absolute; top: 12px; left: 12px; width: 24px; height: 24px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
    .badge.correct { background: var(--success); }
    .badge.incorrect { background: var(--danger); }
    .review-q-text { font-size: 14px; font-weight: bold; margin-left: 32px; margin-bottom: 12px; line-height: 1.4; white-space: pre-wrap; display: flex; flex-direction: column; gap: 4px; }
    .review-q-text span { font-size: 12px; color: #888; font-weight: normal; }
    
    .review-ans-row { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 4px; }
    .review-ans-label { width: 56px; color: #666; font-weight: bold; text-align: right; flex-shrink: 0; }
    .review-ans-val { padding: 8px 10px; border-radius: 6px; flex: 1; border: 1px solid var(--border); font-weight: bold; }
    .review-ans-val.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
    .review-ans-val.incorrect { background: var(--danger-bg); border-color: var(--danger); text-decoration: line-through; color: var(--danger); }
    .review-exp { background: var(--gray-light); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; color: #333; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>

  <!-- 범위 설정 모달 팝업 -->
  <div id="range-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>범위 설정</h3>
      <p>1번부터 106번 사이의 문제 번호<br>범위를 입력하세요.</p>
      <div class="range-inputs">
        <input type="number" id="range-start" min="1" max="106" placeholder="시작">
        <span style="font-weight:bold; color:#555;">~</span>
        <input type="number" id="range-end" min="1" max="106" placeholder="끝">
      </div>
      <div class="modal-btns">
        <button onclick="cancelRange()">취소</button>
        <button onclick="applyRange()" style="background:#1976d2; color:white;">확인</button>
      </div>
    </div>
  </div>

  <div class="phone-container">
    <!-- 1. 메인 화면 -->
    <div id="screen-main" class="screen active">
      <div class="header">
        <div class="header-logo"><div class="logo-box"></div>맞추다</div>
        <div class="header-right">👤 ☰</div>
      </div>
      <div class="content">
        <div class="main-title-box">
          <h1 class="main-title">토목기사 실기 말따먹기</h1>
        </div>
        
        <div class="type-selector">
          <div class="type-label">문제 유형 선택</div>
          <div class="type-buttons" style="grid-template-columns: 1fr 1fr;">
            <button class="type-btn active" id="btn-type-all" onclick="openType('all')">전체 주관식</button>
            <button class="type-btn" id="btn-type-range" onclick="openType('range')">범위문제</button>
          </div>
        </div>

        <div class="qty-selector">
          <div class="qty-label" id="qty-label-text">기출문제 출제 수 조절</div>
          <div class="qty-ctrl">
            <button class="btn-qty" onclick="adjustQty(-10)">-</button>
            <span class="qty-number" id="qty-disp">20문제</span>
            <button class="btn-qty" onclick="adjustQty(10)">+</button>
          </div>
        </div>
        <button class="btn-start" onclick="startStudy()">학습 시작하기</button>
      </div>
    </div>

    <!-- 2. 학습(문제) 화면 -->
    <div id="screen-study" class="screen">
      <div class="header">
        <div class="header-left" onclick="goToMain()">✕</div>
        <div>맞춤 학습</div>
        <div class="header-right" style="opacity:0;">✕</div>
      </div>
      <div class="sub-bar">
        <span id="progress-text">1 / 20</span>
        <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
        <span id="timer-text">00:00</span>
      </div>
      <div class="content" id="quiz-content" style="display: flex; flex-direction: column;"></div>
      <div class="footer-btn-area">
        <button class="btn-next ready" id="btn-submit" onclick="handleNext()">제출</button>
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="screen-result" class="screen">
      <div class="header">
        <div class="header-left" onclick="goToMain()">✕</div>
        <div>학습 결과</div>
        <div class="header-right" style="opacity:0;">✕</div>
      </div>
      <div class="content" style="background-color: #f9fafb;">
        <div class="result-header">학습 개요</div>
        <div class="result-summary-card">
          <div class="result-row"><span>총 문제 수</span><span class="result-val" id="res-total"></span></div>
          <div class="result-row"><span>맞은 문제 수</span><span class="result-val" style="color:var(--success);" id="res-correct"></span></div>
          <div class="result-row"><span>걸린 시간</span><span class="result-val" style="color:#111;" id="res-time"></span></div>
        </div>
        <div class="result-header">내가 푼 문제 분석</div>
        <div id="review-list"></div>
      </div>
    </div>
  </div>

  <script>
    // 106개 전체 주관식 문제 데이터 (굵은 글씨 명칭이 문제 제목으로 변경됨)
    const mockData = [
      {stars: 2, r: 3, q:"방파제 종류 3가지", a:[["직립제","직립"],["경사제","경사"],["혼성제","혼성"]], e:"-직립제\n-경사제\n-혼성제"},
      {stars: 1, r: 4, q:"sand mat의 역할 4가지", a:[["압밀촉진","상부","배수층"],["주행성"],["지하수위"],["연약화"]], e:"-연약지반 압밀촉진을 위한 상부 배수층 형성\n-시공기계의 주행성 확보\n-지하배수층이 되어 지하수위를 저하\n-지하수위 상승시 횡방향 배수로 성토지반의 연약화 방지"},
      {stars: 1, t:'b', q:"일평균 15도 이상일때 습윤상태 보호기간\n- 보통포틀랜드 시멘트 : [ 1 ]일\n- 고로슬래그 시멘트 : [ 2 ]일\n- 조강포틀랜드 시멘트 : [ 3 ]일", a:[["5"],["7"],["3"]], e:"-보통포틀랜드 시멘트 : 5일\n-고로슬래그 시멘트 : 7일\n-조강포틀랜드 시멘트 : 3일"},
      {stars: 2, r: 4, q:"심발공(심빼기 발파공) 종류 4가지", a:[["v컷"],["번컷"],["노컷"],["스윙컷"],["피라미드컷"]], e:"-v컷\n-번컷\n-노컷\n-스윙컷\n-피라미드컷"},
      {stars: 1, q:"강제치환공법의 정의를 설명하시오.", a:[["양질토"],["연약지반"],["자중"],["파괴"],["배제"]], e:"직접 양질토를 연약지반 위에 투하해 그 자중으로 기초지반에 파괴를 일으켜 연약토를 주위로 배제시켜서 지반을 개량하는 공법"},
      {stars: 1, r: 4, q:"강제치환 공법 단점 4가지", a:[["잔류침하"],["확실성"],["설계","이론"],["균일"],["팽창"]], e:"-잔류침하가 예상됨\n-개량효과의 확실성이 없음\n-이론적이며 정량적인 설계가 어려움\n-균일하게 치환하기가 어려움\n-압출에 의한 사면선단의 팽창이 일어남"},
      {stars: 3, r: 4, q:"콘크리트포장 종류 4가지", a:[["무근"],["철근"],["연속철근"],["프리스트레스"]], e:"-무근 콘크리트포장\n-철근 콘크리트포장\n-연속철근 콘크리트포장\n-프리스트레스 콘크리트포장"},
      {stars: 1, r: 3, q:"압출공법에 적용되는 압출방법 3가지", a:[["pulling","풀링"],["pushing","푸싱"],["lift","리프트"]], e:"-Pulling 방법\n-Pushing 방법\n-Lift&pushing 방법"},
      {stars: 1, r: 4, q:"다짐도를 판정하는 방법 4가지", a:[["건조밀도"],["포화도","공극률"],["강도"],["다짐기계","횟수"],["변형"]], e:"-건조밀도로 규정\n-포화도와 공극률로 규정\n-강도 특성으로 규정\n-다짐기계, 다짐횟수로 규정\n-변형 특성으로 규정"},
      {stars: 3, r: 4, q:"도로 노상의 지지력을 평가할 수 있는 현장시험 평가방법 4가지", a:[["cbr"],["k값","평판재하시험"],["cone값","콘값","콘관입시험"],["n치","표준관입시험"]], e:"-CBR\n-평판재하시험 K값\n-콘관입시험 Cone값\n-표준관입시험 N치"},
      {stars: 2, r: 4, q:"기초가 구비해야할 조건 (얕은 기초의 구비조건) 4가지", a:[["경제적"],["근입깊이"],["안전","지지"],["침하"],["시공"]], e:"-경제적인 시공이 가능할 것\n-최소의 근입깊이를 가질 것\n-안전하게 하중을 지지할 수 있을 것\n-허용 침하량을 넘지 않을 것\n-기초공의 시공이 가능할 것"},
      {stars: 3, r: 4, q:"마샬안정도시험으로 얻을 수 있는 설계기준 4가지", a:[["안정도"],["흐름값"],["밀도"],["공극률"],["포화도"]], e:"-안정도\n-흐름값\n-공시체의 밀도\n-공극률\n-포화도"},
      {stars: 3, r: 3, q:"PS 콘크리트 공법 중 동바리를 사용하지 않는 공법 3가지", a:[["fcm","캔틸레버","켄틸레버"],["mss","이동식"],["ilm","압출"]], e:"-FCM(캔틸레버공법)\n-MSS(이동식 비계공법)\n-ILM(압출공법)"},
      {stars: 2, t:'b', q:"배수시설\n- 표면배수: [ 1 ]\n- 지하배수: [ 2 ]\n- 횡단배수: [ 3 ]", a:[["측구","집수정"],["맹암거","유공관"],["암거","배수관"]], e:"-표면배수: 측구, 집수정\n-지하배수: 맹암거, 유공관\n-횡단배수: 암거, 배수관"},

      {stars: 1, t:'b', q:"침하조건식 및 침하촉진방법\n- 침하조건식: [ 1 ]\n- 침하촉진방법: 재하중에 의한 공법, 분사식, 물하중식, 발파에 의한 공법, 감압에 의한 공법", a:[["w>f+q+b"]], e:"-침하조건식: W>F+Q+B\n-침하촉진방법: 재하중에 의한 공법, 분사식 침하공법, 물하중식 침하공법, 발파에 의한 침하공법, 감압에 의한 침하공법"},
      {stars: 1, q:"관로식 냉각에 대해 설명하시오.", a:[["파이프"],["배관"],["냉각수"],["순환"],["온도"]], e:"콘크리트를 타설 전 파이프를 배관하고 파이프 내부에 냉각수를 순환시켜 콘크리트의 온도를 낮추는 방법"},
      {stars: 1, q:"선행 냉각에 대해 설명하시오.", a:[["타설전"],["재료"],["냉각"],["온도"]], e:"콘크리트를 타설하기 전 재료의 일부 또는 전부를 냉각시켜 콘크리트의 온도를 낮추는 방법"},
      {stars: 1, r: 3, q:"앵커의 주요 구성요소 3가지", a:[["앵커두부"],["인장부"],["앵커체"]], e:"-앵커두부\n-인장부\n-앵커체"}
    ];

    let targetQty = 20;
    let quizSet = [];
    let currentIdx = 0;
    let userAnswers = [];
    let timerInterval;
    let startTime;
    let totalSeconds = 0;
    let isConfirmed = false;
    let inputResults = []; 
    let currentPicks = [];
    
    // 유형 관리
    let currentType = 'all'; 
    let rangeStartVal = 1;
    let rangeEndVal = 106;

    function adjustQty(amount) {
      if (currentType === 'range') return;
      targetQty = Math.max(10, Math.min(106, targetQty + amount));
      document.getElementById('qty-disp').innerText = targetQty + '문제';
    }

    function openType(type) {
      if (type === 'range') {
        document.getElementById('range-modal').style.display = 'flex';
      } else {
        currentType = type;
        updateTypeButtons();
      }
    }

    function cancelRange() {
      document.getElementById('range-modal').style.display = 'none';
    }

    function applyRange() {
      const s = parseInt(document.getElementById('range-start').value);
      const e = parseInt(document.getElementById('range-end').value);
      if (isNaN(s) || isNaN(e) || s < 1 || e > 106 || s > e) {
        alert("1부터 106 사이의 올바른 범위를 입력해주세요.");
        return;
      }
      rangeStartVal = s;
      rangeEndVal = e;
      currentType = 'range';
      updateTypeButtons();
      document.getElementById('range-modal').style.display = 'none';
    }

    function updateTypeButtons() {
      document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-type-' + currentType).classList.add('active');
      
      const qtyLabel = document.getElementById('qty-label-text');
      const qtyCtrl = document.querySelector('.qty-ctrl');
      
      if (currentType === 'range') {
        qtyLabel.innerText = `기출문제 범위 (${rangeStartVal}번 ~ ${rangeEndVal}번)`;
        qtyCtrl.style.display = 'none';
      } else {
        qtyLabel.innerText = '기출문제 출제 수 조절';
        qtyCtrl.style.display = 'flex';
      }
    }

    function startStudy() {
      let pool = [];
      if (currentType === 'all') {
        pool = [...mockData];
      } else if (currentType === 'range') {
        pool = mockData.slice(rangeStartVal - 1, rangeEndVal);
      }

      if (pool.length === 0) {
        alert("선택하신 조건에 해당하는 문제가 없습니다.");
        return;
      }

      quizSet = [];
      let availableQuestions = [...pool];
      let actualQty = (currentType === 'range') ? pool.length : Math.min(targetQty, pool.length);

      for (let i = 0; i < actualQty; i++) {
        const randomIndex = Math.floor(Math.random() * availableQuestions.length);
        const selectedQuestion = availableQuestions.splice(randomIndex, 1)[0];
        const originalIndex = mockData.findIndex(m => m.q === selectedQuestion.q) + 1; 
        quizSet.push({ ...selectedQuestion, originalIdx: originalIndex, displayNum: i + 1 });
      }

      currentIdx = 0;
      userAnswers = [];
      totalSeconds = 0;
      document.getElementById('screen-main').classList.remove('active');
      document.getElementById('screen-study').classList.add('active');
      
      startTimer();
      renderQuiz();
    }

    function startTimer() {
      clearInterval(timerInterval);
      startTime = Date.now();
      timerInterval = setInterval(() => {
        totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('timer-text').innerText = `${m}:${s}`;
      }, 1000);
    }

    function renderQuiz() {
      isConfirmed = false;
      inputResults = [];
      currentPicks = [];
      
      const q = quizSet[currentIdx];
      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizSet.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / quizSet.length) * 100}%`;

      const nextBtn = document.getElementById('btn-submit');
      nextBtn.innerText = "제출";

      let html = `<div class="question-wrapper">`;
      
      if(q.stars && q.stars > 0) {
        html += `<div class="star-badge">${q.stars}회 출제</div>`;
      }
      
      html += ` <div class="question-num">${q.displayNum}. <span>(No. ${q.originalIdx})</span></div>
                <div class="question-text">${q.q}</div>
              </div>`;
      
      html += `<div class="question-guide">${q.t === 'b' ? '빈칸 번호에 맞춰 순서대로 답안을 입력하세요.' : '핵심 키워드를 포함하여 답안을 입력하세요.'}</div>
               <div class="multi-input-container">`;
      const reqCount = q.t === 'b' ? q.a.length : (q.r || (q.a ? q.a.length : 1));
      for(let i=0; i<reqCount; i++) {
        let label = q.t === 'b' ? `[ ${i+1} ]` : `답안 ${i+1}`;
        html += `<div class="input-row">
                   <div class="input-label">${label}</div>
                   <input type="text" class="subj-input ans-input">
                 </div>`;
      }
      html += `</div><button class="btn-idk" onclick="handleIdk()">모름 (정답 바로보기)</button>`;

      html += `<div class="explanation-box" id="exp-box">
                 <div class="exp-title">모범 답안 및 원본 내용</div>
                 <div class="exp-real-answer" id="exp-real-answer"></div>
               </div>`;

      document.getElementById('quiz-content').innerHTML = html;
    }

    function handleIdk() {
      if (isConfirmed) return;
      document.querySelectorAll('.ans-input').forEach(el => {
        if(el.value.trim() === '') el.value = '모름';
      });
      handleNext(); 
    }

    function handleNext() {
      const q = quizSet[currentIdx];
      const nextBtn = document.getElementById('btn-submit');

      if (!isConfirmed) {
        isConfirmed = true;
        let isCorrect = true;

        let targetAnsArray = q.a;
        let usedAns = new Array(targetAnsArray.length).fill(false);
        const inputs = document.querySelectorAll('.ans-input');
        
        inputs.forEach((el, idx) => {
          let val = el.value.trim();
          currentPicks.push(val);
          let cleanVal = val.replace(/\s+/g,'').toLowerCase();
          let matched = false;
          
          if (cleanVal !== "" && cleanVal !== "모름") {
            if (q.t === 'b') {
              if (targetAnsArray[idx] && targetAnsArray[idx].some(k => cleanVal.includes(k.replace(/\s+/g,'').toLowerCase()))) matched = true;
            } else {
              for(let j=0; j<targetAnsArray.length; j++) {
                if(!usedAns[j] && targetAnsArray[j].some(k => cleanVal.includes(k.replace(/\s+/g,'').toLowerCase()))) {
                  matched = true;
                  usedAns[j] = true;
                  break;
                }
              }
            }
          }
          inputResults.push(matched);
          if (!matched) isCorrect = false; 
        });

        inputs.forEach((el, idx) => {
          el.readOnly = true;
          let icon = document.createElement('div');
          icon.className = 'input-status-icon ' + (inputResults[idx] ? 'correct' : 'incorrect');
          icon.innerText = inputResults[idx] ? 'O' : 'X';
          el.parentNode.appendChild(icon);
        });
        const idkBtn = document.querySelector('.btn-idk');
        if(idkBtn) idkBtn.style.display = 'none';

        const realAnsBox = document.getElementById('exp-real-answer');
        realAnsBox.innerText = q.e;
        document.getElementById('exp-box').style.display = 'block';

        userAnswers.push({
          qIndex: q.originalIdx,
          displayNum: q.displayNum,
          stars: q.stars,
          question: q.q,
          isCorrect: isCorrect,
          picks: currentPicks,
          corrects: inputResults,
          exp: q.e
        });

        nextBtn.innerText = (currentIdx === quizSet.length - 1) ? "결과 보기" : "다음 문제로";

      } else {
        if (currentIdx < quizSet.length - 1) {
          currentIdx++;
          renderQuiz();
        } else {
          showResult();
        }
      }
    }

    function showResult() {
      clearInterval(timerInterval);
      document.getElementById('screen-study').classList.remove('active');
      document.getElementById('screen-result').classList.add('active');

      const correctCount = userAnswers.filter(a => a.isCorrect).length;
      document.getElementById('res-total').innerText = quizSet.length + '문제';
      document.getElementById('res-correct').innerText = correctCount + '문제';
      
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      document.getElementById('res-time').innerText = `${m}분 ${s}초`;

      let html = '';
      userAnswers.forEach((ans) => {
        html += `<div class="review-card ${ans.isCorrect ? 'correct' : 'incorrect'}">
                   <span class="badge ${ans.isCorrect ? 'correct' : 'incorrect'}">${ans.isCorrect ? '✓' : '✕'}</span>`;
        
        if(ans.stars && ans.stars > 0) {
          html += `<div class="star-badge" style="margin-left: 32px;">${ans.stars}회 출제</div>`;
        }

        html += `  <div class="review-q-text" style="margin-top: 4px;">${ans.displayNum}. ${ans.question} <span>(No. ${ans.qIndex})</span></div>
                   <div style="margin-left: 32px; display: flex; flex-direction: column; gap: 6px;">`;

        ans.picks.forEach((p, idx) => {
          let style = ans.corrects[idx] ? 'correct' : 'incorrect';
          let label = `답안 ${idx+1}`;
          html += `<div class="review-ans-row">
                     <div class="review-ans-label">${label}</div>
                     <div class="review-ans-val ${style}">${p || '미입력'}</div>
                   </div>`;
        });

        html += `  </div>
                   <div class="review-exp" style="margin-left:32px;"><strong>모범 답안 및 원본 내용:</strong><br>${ans.exp}</div>
                 </div>`;
      });
      document.getElementById('review-list').innerHTML = html;
    }

    function goToMain() {
      clearInterval(timerInterval);
      document.getElementById('screen-study').classList.remove('active');
      document.getElementById('screen-result').classList.remove('active');
      document.getElementById('screen-main').classList.add('active');
    }
  </script>
</body>
</html>
